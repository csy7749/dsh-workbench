<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>工作流画布 · 节点编排</title>
<style>
:root{
  --bg:#14161a; --panel:#1a1d23; --card:#20242c; --line:#2b303a;
  --text:#e6e9ef; --muted:#8f98a8; --accent:#7c9cff;
  --ok:#4ade80; --warn:#fbbf24; --err:#f87171;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font:13px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
button{font:inherit;color:inherit}

/* ---------- 顶栏 ---------- */
.topbar{height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:600;font-size:13px;letter-spacing:.2px;white-space:nowrap}
.brand small{color:var(--muted);font-weight:400;margin-left:8px}
.name{background:#15181e;border:1px solid var(--line);border-radius:6px;color:var(--text);
  padding:5px 9px;width:190px;font:inherit;outline:none}
.name:focus{border-color:var(--accent)}
.spacer{flex:1}
.btn{background:#262b34;border:1px solid var(--line);border-radius:6px;padding:5px 11px;
  cursor:pointer;white-space:nowrap;transition:.12s}
.btn:hover{background:#2f3540;border-color:#3a4150}
.btn.primary{background:#3350b8;border-color:#3f60d0}
.btn.primary:hover{background:#3d5cca}
.btn.danger{color:#fca5a5}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- 布局 ---------- */
.app{display:grid;grid-template-columns:186px 1fr 286px;height:calc(100% - 46px)}

/* ---------- 左：节点库 ---------- */
.palette{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:10px 8px}
.pal-group{margin-bottom:14px}
.pal-title{font-size:11px;color:var(--muted);padding:0 4px 6px;letter-spacing:.5px}
.pal-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:7px;
  padding:7px 9px;margin-bottom:6px;cursor:pointer;transition:.12s}
.pal-item:hover{border-color:#3d4557;background:#252a33;transform:translateX(1px)}
.pal-dot{width:7px;height:7px;border-radius:50%;flex:none}
.pal-hint{font-size:11px;color:var(--muted);padding:4px 4px 0;line-height:1.7}

/* ---------- 中：画布 ---------- */
.canvas-wrap{position:relative;overflow:hidden;cursor:grab;
  background-image:radial-gradient(circle,#252a33 1px,transparent 1px);background-size:22px 22px}
.canvas-wrap.panning{cursor:grabbing}
.canvas-wrap.linking{cursor:crosshair}
#scene{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#edges{position:absolute;left:0;top:0;width:6000px;height:6000px;overflow:visible;pointer-events:none;z-index:0}
#nodes{position:absolute;left:0;top:0;z-index:1}
#edges .hit{stroke:transparent;stroke-width:16;fill:none;pointer-events:stroke;cursor:pointer}
#edges .wire{fill:none;stroke-width:2.2;stroke-linecap:round}
#edges .wire.temp{stroke-dasharray:5 5;opacity:.8}

.node{position:absolute;width:200px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.35);cursor:grab;user-select:none}
.node.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 10px 26px rgba(0,0,0,.5)}
.node.running{border-color:var(--accent);animation:pulse 1.1s ease-in-out infinite}
.node.waiting{border-color:var(--warn);box-shadow:0 0 0 1px rgba(251,191,36,.5),0 8px 22px rgba(0,0,0,.45)}
.node.done{border-color:rgba(74,222,128,.55)}
.node.failed{border-color:var(--err)}
.node.blocked{opacity:.5}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(124,156,255,.45)}50%{box-shadow:0 0 0 6px rgba(124,156,255,0)}}
.node-head{height:36px;display:flex;align-items:center;gap:8px;padding:0 10px;
  border-bottom:1px solid var(--line)}
.node-dot{width:7px;height:7px;border-radius:50%;flex:none}
.node-title{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node-rows{padding:8px 0 10px}
.row{height:24px;display:flex;align-items:center;position:relative;padding:0 13px;font-size:11px;color:var(--muted)}
.row.out{justify-content:flex-end}
.port{position:absolute;width:11px;height:11px;border-radius:50%;top:50%;margin-top:-5.5px;
  border:2px solid var(--bg);cursor:crosshair;transition:transform .1s}
.row.in .port{left:-6px}
.row.out .port{right:-6px}
.port:hover{transform:scale(1.45)}
.node-btn{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%);
  background:#7a5a10;border:1px solid #b98a1c;border-radius:6px;padding:3px 10px;
  font-size:11px;cursor:pointer;white-space:nowrap}

/* ---------- 右：属性 ---------- */
.inspector{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:12px}
.ins-title{font-size:12px;font-weight:600;margin:0 0 2px}
.ins-sub{font-size:11px;color:var(--muted);margin-bottom:14px;word-break:break-all}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.field input[type=text],.field input[type=number],.field select,.field textarea{
  width:100%;background:#15181e;border:1px solid var(--line);border-radius:6px;
  color:var(--text);padding:6px 8px;font:inherit;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:60px;font-size:12px}
.field.check{display:flex;align-items:center;gap:8px}
.field.check label{margin:0}
.empty{color:var(--muted);font-size:12px;text-align:center;padding:26px 6px;line-height:1.9}
.kv{display:flex;justify-content:space-between;font-size:11px;padding:4px 0;border-bottom:1px dashed #262b34}
.kv span:last-child{color:var(--muted)}
.sep{height:1px;background:var(--line);margin:14px 0}

/* ---------- 状态栏 & 提示 ---------- */
.statusbar{position:absolute;left:12px;bottom:12px;display:flex;gap:8px;align-items:center;
  background:rgba(26,29,35,.92);border:1px solid var(--line);border-radius:8px;padding:5px 10px;
  font-size:11px;color:var(--muted);backdrop-filter:blur(6px)}
.statusbar b{color:var(--text);font-weight:600}
.zoomhint{position:absolute;right:12px;bottom:12px;font-size:11px;color:var(--muted);
  background:rgba(26,29,35,.92);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
  background:#2a303a;border:1px solid #3b4353;border-radius:8px;padding:8px 16px;font-size:12px;
  opacity:0;pointer-events:none;transition:.22s;z-index:99;max-width:60vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{border-color:#7f2b2b;background:#3a2020}
#toast.ok{border-color:#2b6b45;background:#1d3327}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">工作流画布<small>节点编排原型</small></div>
  <input class="name" id="flowName" value="模块设计流水线" />
  <div class="spacer"></div>
  <button class="btn" id="btnSample">示例图</button>
  <button class="btn" id="btnFit">适应画布</button>
  <button class="btn" id="btnValidate">校验</button>
  <button class="btn primary" id="btnRun">▶ 运行</button>
  <button class="btn danger" id="btnStop" disabled>停止</button>
  <button class="btn" id="btnSave">导出 JSON</button>
  <button class="btn" id="btnLoad">导入</button>
  <input type="file" id="fileInput" accept=".json" hidden />
</div>

<div class="app">
  <aside class="palette" id="palette"></aside>

  <main class="canvas-wrap" id="wrap">
    <div id="scene">
      <svg id="edges"></svg>
      <div id="nodes"></div>
    </div>
    <div class="statusbar" id="statusbar"></div>
    <div class="zoomhint" id="zoomhint">滚轮缩放 · 空白拖拽平移 · Delete 删除</div>
  </main>

  <aside class="inspector" id="inspector"></aside>
</div>

<div id="toast"></div>

<script>
(function () {
  'use strict';

  var W = 200, HEADER = 36, ROW_H = 24, PAD_TOP = 8, PAD_BOTTOM = 10;

  var TYPE_COLOR = {
    'file-set': '#4ade80', markdown: '#a78bfa', text: '#93c5fd',
    json: '#22d3ee', report: '#f472b6', any: '#94a3b8', control: '#fbbf24'
  };

  var CAT = {
    input:    { name: '输入',   accent: '#4ade80' },
    retrieve: { name: '检索',   accent: '#22d3ee' },
    generate: { name: '生成',   accent: '#a78bfa' },
    tool:     { name: '工具',   accent: '#38bdf8' },
    human:    { name: '人工',   accent: '#fbbf24' },
    check:    { name: '校验',   accent: '#60a5fa' },
    output:   { name: '输出',   accent: '#f472b6' }
  };

  var DEFS = {
    'input.doc': {
      title: '输入文档', cat: 'input',
      inputs: [],
      outputs: [{ id: 'out', label: '文档', type: 'file-set' }],
      config: [
        { key: 'source', label: '来源', kind: 'select', options: ['产品笔记', '模块文档', '本地上传'], value: '产品笔记' },
        { key: 'mustExist', label: '必须存在', kind: 'check', value: true }
      ]
    },
    'retrieve.knowledge': {
      title: '知识检索', cat: 'retrieve',
      inputs: [{ id: 'q', label: '查询', type: 'text' }],
      outputs: [{ id: 'hits', label: '片段', type: 'json' }],
      config: [
        { key: 'topK', label: '返回条数', kind: 'number', value: 6 },
        { key: 'scope', label: '范围', kind: 'select', options: ['本项目', '全部知识库'], value: '本项目' }
      ]
    },
    'dsh.generate': {
      title: 'DSH 生成', cat: 'generate',
      inputs: [{ id: 'in', label: '输入', type: 'any' }],
      outputs: [{ id: 'out', label: '产物', type: 'markdown' }],
      config: [
        { key: 'profile', label: '执行配置', kind: 'select', options: ['默认', '经济', '强力'], value: '默认' },
        { key: 'prompt', label: '提示词', kind: 'textarea', value: '按模块逐条产出设计笔记，每条含背景/目标/流程/边界/验收。' },
        { key: 'temperature', label: '温度', kind: 'range', min: 0, max: 1, step: 0.1, value: 0.4 },
        { key: 'allowTools', label: '允许调用工具', kind: 'check', value: false }
      ]
    },
    'tool.call': {
      title: '工具调用', cat: 'tool',
      inputs: [{ id: 'in', label: '入参', type: 'any' }],
      outputs: [{ id: 'out', label: '结果', type: 'json' }],
      config: [
        { key: 'tool', label: '已登记工具', kind: 'select',
          options: ['knowledge.search', 'product.module.set', 'note.publish'], value: 'knowledge.search' },
        { key: 'args', label: '参数映射 (JSON)', kind: 'textarea', value: '{\n  "query": "{{in}}",\n  "topK": 6\n}' }
      ]
    },
    'transform.extract': {
      title: '结构提炼', cat: 'generate',
      inputs: [{ id: 'in', label: '输入', type: 'any' }],
      outputs: [{ id: 'out', label: '结构', type: 'json' }],
      config: [
        { key: 'shape', label: '输出结构', kind: 'select', options: ['模块树', '功能清单', '需求列表'], value: '模块树' },
        { key: 'depth', label: '最大层级', kind: 'number', value: 3 }
      ]
    },
    'human.edit-confirm': {
      title: '人工编辑确认', cat: 'human',
      inputs: [{ id: 'in', label: '待审产物', type: 'any' }],
      outputs: [{ id: 'out', label: '已确认', type: 'any' }],
      config: [
        { key: 'editor', label: '编辑器', kind: 'select', options: ['Markdown', '表格', '富文本'], value: 'Markdown' },
        { key: 'note', label: '给审阅者的说明', kind: 'textarea', value: '请核对模块拆分是否与产品目标一致。' },
        { key: 'timeout', label: '超时（分钟）', kind: 'number', value: 120 }
      ]
    },
    'check.rules': {
      title: '规则校验', cat: 'check',
      inputs: [{ id: 'in', label: '待校验', type: 'any' }],
      outputs: [
        { id: 'pass', label: '通过', type: 'any' },
        { id: 'fail', label: '未通过', type: 'report' }
      ],
      config: [
        { key: 'rules', label: '必需检查', kind: 'select', options: ['非空', '结构完整', '引用可解析', '无占位符'], value: '结构完整' },
        { key: 'strict', label: '任一失败即中断', kind: 'check', value: true }
      ]
    },
    'publish.domain': {
      title: '发布到领域', cat: 'output',
      inputs: [{ id: 'in', label: '产物', type: 'any' }],
      outputs: [],
      config: [
        { key: 'target', label: '目标', kind: 'select', options: ['产品模块', '设计笔记', '文件导出'], value: '设计笔记' },
        { key: 'overwrite', label: '允许覆盖', kind: 'check', value: false }
      ]
    }
  };

  var state = {
    nodes: [], edges: [], sel: null,
    pan: { x: 90, y: 70, k: 1 },
    seq: 0, temp: null, running: false, abort: false, pendingHuman: null
  };

  var wrap = document.getElementById('wrap');
  var scene = document.getElementById('scene');
  var edgesEl = document.getElementById('edges');
  var nodesEl = document.getElementById('nodes');
  var inspectorEl = document.getElementById('inspector');
  var paletteEl = document.getElementById('palette');
  var statusbarEl = document.getElementById('statusbar');
  var toastEl = document.getElementById('toast');

  /* ---------------- 工具 ---------------- */
  function h(tag, props) {
    var el = document.createElement(tag), kids = Array.prototype.slice.call(arguments, 2);
    if (props) {
      Object.keys(props).forEach(function (k) {
        var v = props[k];
        if (v == null) return;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k === 'style') Object.assign(el.style, v);
        else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2).toLowerCase(), v);
        else el.setAttribute(k, v);
      });
    }
    kids.forEach(function walk(kid) {
      if (kid == null) return;
      if (Array.isArray(kid)) { kid.forEach(walk); return; }
      el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    });
    return el;
  }

  function toast(msg, kind) {
    toastEl.textContent = msg;
    toastEl.className = 'show' + (kind ? ' ' + kind : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toastEl.className = ''; }, 2600);
  }

  function uid(prefix) { state.seq += 1; return prefix + '-' + state.seq; }
  function nodeById(id) { return state.nodes.filter(function (n) { return n.id === id; })[0]; }
  function defOf(node) { return DEFS[node.defId]; }
  function portIndex(def, dir, portId) {
    var list = dir === 'in' ? def.inputs : def.outputs;
    for (var i = 0; i < list.length; i++) if (list[i].id === portId) return i;
    return -1;
  }
  function portSpec(def, dir, portId) {
    var list = dir === 'in' ? def.inputs : def.outputs;
    for (var i = 0; i < list.length; i++) if (list[i].id === portId) return list[i];
    return null;
  }
  function nodeRows(node) { var d = defOf(node); return d.inputs.length + d.outputs.length; }
  function nodeHeight(node) { return HEADER + PAD_TOP + nodeRows(node) * ROW_H + PAD_BOTTOM; }
  function portPos(node, dir, index) {
    return {
      x: dir === 'in' ? node.x : node.x + W,
      y: node.y + HEADER + PAD_TOP + index * ROW_H + ROW_H / 2
    };
  }
  function bez(a, b) {
    var dx = Math.max(46, Math.abs(b.x - a.x) * 0.45);
    return 'M' + a.x + ' ' + a.y + ' C' + (a.x + dx) + ' ' + a.y + ' ' +
      (b.x - dx) + ' ' + b.y + ' ' + b.x + ' ' + b.y;
  }

  /* ---------------- 图操作 ---------------- */
  function addNode(defId, x, y) {
    var def = DEFS[defId];
    var cfg = {};
    (def.config || []).forEach(function (c) { cfg[c.key] = c.value; });
    var n = { id: uid('n'), defId: defId, x: x, y: y, config: cfg, status: 'idle' };
    state.nodes.push(n);
    state.sel = { kind: 'node', id: n.id };
    render();
    return n;
  }

  function removeNode(id) {
    state.nodes = state.nodes.filter(function (n) { return n.id !== id; });
    state.edges = state.edges.filter(function (e) { return e.from.node !== id && e.to.node !== id; });
    if (state.sel && state.sel.id === id) state.sel = null;
    render();
  }

  function canConnect(from, to) {
    if (from.node === to.node) return '不能连到自己';
    var a = nodeById(from.node), b = nodeById(to.node);
    if (!a || !b) return '节点不存在';
    var pa = portSpec(defOf(a), 'out', from.port);
    var pb = portSpec(defOf(b), 'in', to.port);
    if (!pa || !pb) return '端口不存在';
    if (pa.type !== 'any' && pb.type !== 'any' && pa.type !== pb.type) {
      return '类型不匹配：' + pa.type + ' → ' + pb.type;
    }
    var dup = state.edges.some(function (e) {
      return e.from.node === from.node && e.from.port === from.port &&
             e.to.node === to.node && e.to.port === to.port;
    });
    if (dup) return '这条连线已存在';
    return null;
  }

  function connect(from, to) {
    var err = canConnect(from, to);
    if (err) { toast(err, 'err'); return false; }
    // 一个输入端口只收一条线
    state.edges = state.edges.filter(function (e) {
      return !(e.to.node === to.node && e.to.port === to.port);
    });
    state.edges.push({ id: uid('e'), from: from, to: to });
    return true;
  }

  /* ---------------- 渲染：节点库 ---------------- */
  function renderPalette() {
    paletteEl.innerHTML = '';
    Object.keys(CAT).forEach(function (catKey) {
      var cat = CAT[catKey];
      var ids = Object.keys(DEFS).filter(function (id) { return DEFS[id].cat === catKey; });
      if (!ids.length) return;
      var group = h('div', { class: 'pal-group' },
        h('div', { class: 'pal-title', text: cat.name })
      );
      ids.forEach(function (id) {
        var def = DEFS[id];
        group.append(h('button', {
          class: 'pal-item',
          onclick: function () { addAtCenter(id); }
        },
          h('span', { class: 'pal-dot', style: { background: cat.accent } }),
          h('span', { text: def.title })
        ));
      });
      paletteEl.append(group);
    });
    paletteEl.append(h('div', { class: 'pal-hint', text: '点击添加节点 · 从右侧圆点拖到左侧圆点连线' }));
  }

  function addAtCenter(defId) {
    var r = wrap.getBoundingClientRect();
    var x = (r.width / 2 - state.pan.x) / state.pan.k - W / 2 + (Math.random() * 40 - 20);
    var y = (r.height / 2 - state.pan.y) / state.pan.k - 40 + (Math.random() * 40 - 20);
    addNode(defId, Math.round(x), Math.round(y));
  }

  /* ---------------- 渲染：节点 ---------------- */
  function nodeHTML(n) {
    var def = defOf(n), cat = CAT[def.cat];
    var cls = 'node' + (state.sel && state.sel.kind === 'node' && state.sel.id === n.id ? ' selected' : '') +
      (n.status !== 'idle' ? ' ' + n.status : '');
    var rows = '';
    def.inputs.forEach(function (p, i) {
      var color = TYPE_COLOR[p.type] || '#94a3b8';
      rows += '<div class="row in"><span class="port" data-dir="in" data-node="' + n.id +
        '" data-port="' + p.id + '" data-index="' + i + '" style="background:' + color +
        '"></span>' + p.label + '</div>';
    });
    def.outputs.forEach(function (p, i) {
      var color = TYPE_COLOR[p.type] || '#94a3b8';
      rows += '<div class="row out"><span class="port" data-dir="out" data-node="' + n.id +
        '" data-port="' + p.id + '" data-index="' + i + '" style="background:' + color +
        '"></span>' + p.label + '</div>';
    });
    var btn = n.status === 'waiting'
      ? '<button class="node-btn" data-confirm="' + n.id + '">确认并继续</button>' : '';
    return '<div class="' + cls + '" data-id="' + n.id + '" style="left:' + n.x + 'px;top:' + n.y + 'px">' +
      '<div class="node-head"><span class="node-dot" style="background:' + cat.accent + '"></span>' +
      '<span class="node-title">' + def.title + '</span></div>' +
      '<div class="node-rows">' + rows + '</div>' + btn + '</div>';
  }

  function renderNodes() {
    nodesEl.innerHTML = state.nodes.map(nodeHTML).join('');
  }

  /* ---------------- 渲染：连线 ---------------- */
  function renderEdges() {
    var parts = [];
    state.edges.forEach(function (e) {
      var a = nodeById(e.from.node), b = nodeById(e.to.node);
      if (!a || !b) return;
      var da = defOf(a), db = defOf(b);
      var ia = portIndex(da, 'out', e.from.port), ib = portIndex(db, 'in', e.to.port);
      if (ia < 0 || ib < 0) return;
      var p1 = portPos(a, 'out', ia), p2 = portPos(b, 'in', ib);
      var spec = portSpec(da, 'out', e.from.port);
      var color = TYPE_COLOR[spec.type] || '#94a3b8';
      var d = bez(p1, p2);
      var selected = state.sel && state.sel.kind === 'edge' && state.sel.id === e.id;
      parts.push('<path class="hit" data-edge="' + e.id + '" d="' + d + '"></path>');
      parts.push('<path class="wire" d="' + d + '" stroke="' + color + '" opacity="' +
        (selected ? 1 : 0.75) + '" stroke-width="' + (selected ? 3.2 : 2.2) + '"></path>');
    });
    if (state.temp) {
      var ta = nodeById(state.temp.from.node);
      if (ta) {
        var tda = defOf(ta);
        var tia = portIndex(tda, 'out', state.temp.from.port);
        if (tia >= 0) {
          var s = portPos(ta, 'out', tia);
          var color2 = TYPE_COLOR[(portSpec(tda, 'out', state.temp.from.port) || {}).type] || '#94a3b8';
          parts.push('<path class="wire temp" d="' + bez(s, state.temp.point) + '" stroke="' + color2 + '"></path>');
        }
      }
    }
    edgesEl.innerHTML = parts.join('');
  }

  /* ---------------- 渲染：属性面板 ---------------- */
  function renderInspector() {
    inspectorEl.innerHTML = '';
    var sel = state.sel;

    if (!sel) {
      inspectorEl.append(h('div', { class: 'empty' },
        '未选中任何节点' + String.fromCharCode(10) + '点击节点查看配置'));
      inspectorEl.append(h('div', { class: 'sep' }));
      inspectorEl.append(h('div', { class: 'ins-sub', text:
        '连线规则：输出端口 → 输入端口；标 any 的端口接受任意类型，其余必须同类型；一个输入只收一条线。' }));
      return;
    }

    if (sel.kind === 'edge') {
      var e = state.edges.filter(function (x) { return x.id === sel.id; })[0];
      if (!e) { state.sel = null; renderInspector(); return; }
      var a = nodeById(e.from.node), b = nodeById(e.to.node);
      inspectorEl.append(h('div', { class: 'ins-title', text: '连线' }));
      inspectorEl.append(h('div', { class: 'ins-sub', text:
        (a ? defOf(a).title : '?') + ' → ' + (b ? defOf(b).title : '?') }));
      inspectorEl.append(h('div', { class: 'kv' }, h('span', { text: '来源端口' }), h('span', { text: e.from.port })));
      inspectorEl.append(h('div', { class: 'kv' }, h('span', { text: '目标端口' }), h('span', { text: e.to.port })));
      inspectorEl.append(h('div', { class: 'sep' }));
      inspectorEl.append(h('button', {
        class: 'btn danger', style: { width: '100%' }, text: '删除这条连线',
        onclick: function () {
          state.edges = state.edges.filter(function (x) { return x.id !== e.id; });
          state.sel = null; render();
        }
      }));
      return;
    }

    var n = nodeById(sel.id);
    if (!n) { state.sel = null; renderInspector(); return; }
    var def = defOf(n), cat = CAT[def.cat];

    inspectorEl.append(h('div', { class: 'ins-title', text: def.title }));
    inspectorEl.append(h('div', { class: 'ins-sub', text: n.id + ' · ' + cat.name + ' · ' + n.defId }));

    (def.config || []).forEach(function (c) {
      var val = n.config[c.key];
      var field = h('div', { class: 'field' + (c.kind === 'check' ? ' check' : '') });
      if (c.kind === 'check') {
        var cb = h('input', { type: 'checkbox' });
        cb.checked = !!val;
        cb.addEventListener('change', function () { n.config[c.key] = cb.checked; });
        field.append(cb, h('label', { text: c.label }));
      } else if (c.kind === 'select') {
        var selEl = h('select');
        c.options.forEach(function (o) {
          var opt = h('option', { value: o, text: o });
          if (o === val) opt.selected = true;
          selEl.append(opt);
        });
        selEl.addEventListener('change', function () { n.config[c.key] = selEl.value; });
        field.append(h('label', { text: c.label }), selEl);
      } else if (c.kind === 'textarea') {
        var ta = h('textarea');
        ta.value = val == null ? '' : val;
        ta.addEventListener('input', function () { n.config[c.key] = ta.value; });
        field.append(h('label', { text: c.label }), ta);
      } else if (c.kind === 'range') {
        var rg = h('input', { type: 'range', min: c.min, max: c.max, step: c.step });
        rg.value = val;
        var out = h('span', { style: { fontSize: '11px', color: '#8f98a8' }, text: String(val) });
        rg.addEventListener('input', function () {
          n.config[c.key] = Number(rg.value); out.textContent = rg.value;
        });
        field.append(h('label', { text: c.label }), rg, out);
      } else {
        var inp = h('input', { type: c.kind === 'number' ? 'number' : 'text' });
        inp.value = val == null ? '' : val;
        inp.addEventListener('input', function () {
          n.config[c.key] = c.kind === 'number' ? Number(inp.value) : inp.value;
        });
        field.append(h('label', { text: c.label }), inp);
      }
      inspectorEl.append(field);
    });

    if (n.status === 'waiting') {
      inspectorEl.append(h('button', {
        class: 'btn primary', style: { width: '100%', marginBottom: '10px' },
        text: '确认并继续', onclick: function () { confirmHuman(n.id); }
      }));
    }

    inspectorEl.append(h('div', { class: 'sep' }));
    inspectorEl.append(h('div', { class: 'kv' },
      h('span', { text: '状态' }), h('span', { text: n.status })));
    inspectorEl.append(h('div', { class: 'kv' },
      h('span', { text: '输入端口' }), h('span', { text: def.inputs.length + ' 个' })));
    inspectorEl.append(h('div', { class: 'kv' },
      h('span', { text: '输出端口' }), h('span', { text: def.outputs.length + ' 个' })));
    inspectorEl.append(h('div', { class: 'sep' }));
    inspectorEl.append(h('button', {
      class: 'btn danger', style: { width: '100%' }, text: '删除节点',
      onclick: function () { removeNode(n.id); }
    }));
  }

  function renderStatus() {
    statusbarEl.innerHTML = '';
    var counts = { idle: 0, running: 0, waiting: 0, done: 0, failed: 0, blocked: 0 };
    state.nodes.forEach(function (n) { counts[n.status] = (counts[n.status] || 0) + 1; });
    statusbarEl.append(
      h('span', null, '节点 ', h('b', { text: String(state.nodes.length) })),
      h('span', { text: '·' }),
      h('span', null, '连线 ', h('b', { text: String(state.edges.length) })),
      h('span', { text: '·' })
    );
    if (state.running) statusbarEl.append(h('span', { style: { color: '#7c9cff' }, text: '运行中' }));
    else if (counts.waiting) statusbarEl.append(h('span', { style: { color: '#fbbf24' }, text: '等待人工确认 ' + counts.waiting }));
    else if (counts.done) statusbarEl.append(h('span', { style: { color: '#4ade80' }, text: '已完成 ' + counts.done }));
    else if (counts.failed) statusbarEl.append(h('span', { style: { color: '#f87171' }, text: '失败 ' + counts.failed }));
    else statusbarEl.append(h('span', { text: '就绪' }));
    document.getElementById('zoomhint').textContent =
      Math.round(state.pan.k * 100) + '% · 滚轮缩放 · 空白拖拽平移 · Delete 删除';
  }

  function render() {
    renderNodes();
    renderEdges();
    renderInspector();
    renderStatus();
  }

  /* ---------------- 视口 ---------------- */
  function applyTransform() {
    scene.style.transform = 'translate(' + state.pan.x + 'px,' + state.pan.y + 'px) scale(' + state.pan.k + ')';
    renderStatus();
  }

  function toWorld(ev) {
    var r = wrap.getBoundingClientRect();
    return {
      x: (ev.clientX - r.left - state.pan.x) / state.pan.k,
      y: (ev.clientY - r.top - state.pan.y) / state.pan.k
    };
  }

  function fitView() {
    if (!state.nodes.length) { state.pan = { x: 90, y: 70, k: 1 }; applyTransform(); return; }
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    state.nodes.forEach(function (n) {
      minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
      maxX = Math.max(maxX, n.x + W); maxY = Math.max(maxY, n.y + nodeHeight(n));
    });
    var r = wrap.getBoundingClientRect();
    var pad = 70;
    var kx = (r.width - pad * 2) / Math.max(1, maxX - minX);
    var ky = (r.height - pad * 2) / Math.max(1, maxY - minY);
    var k = Math.min(1.15, Math.max(0.3, Math.min(kx, ky)));
    state.pan = {
      k: k,
      x: r.width / 2 - ((minX + maxX) / 2) * k,
      y: r.height / 2 - ((minY + maxY) / 2) * k
    };
    applyTransform();
  }

  /* ---------------- 交互 ---------------- */
  var drag = null;

  wrap.addEventListener('pointerdown', function (ev) {
    if (ev.button === 1) return;
    var portEl = ev.target.closest ? ev.target.closest('.port') : null;
    var nodeEl = ev.target.closest ? ev.target.closest('.node') : null;

    if (portEl && portEl.dataset.dir === 'out') {
      ev.preventDefault();
      drag = {
        type: 'link',
        from: { node: portEl.dataset.node, port: portEl.dataset.port }
      };
      wrap.classList.add('linking');
      return;
    }

    if (nodeEl) {
      ev.preventDefault();
      var id = nodeEl.dataset.id;
      state.sel = { kind: 'node', id: id };
      var n = nodeById(id);
      var w = toWorld(ev);
      drag = { type: 'node', id: id, dx: w.x - n.x, dy: w.y - n.y };
      render();
      return;
    }

    state.sel = null;
    drag = { type: 'pan', sx: ev.clientX, sy: ev.clientY, ox: state.pan.x, oy: state.pan.y };
    wrap.classList.add('panning');
    render();
  });

  document.addEventListener('pointermove', function (ev) {
    if (!drag) return;
    if (drag.type === 'node') {
      var n = nodeById(drag.id);
      if (!n) return;
      var w = toWorld(ev);
      n.x = Math.round(w.x - drag.dx);
      n.y = Math.round(w.y - drag.dy);
      var el = nodesEl.querySelector('.node[data-id="' + n.id + '"]');
      if (el) { el.style.left = n.x + 'px'; el.style.top = n.y + 'px'; }
      renderEdges();
    } else if (drag.type === 'pan') {
      state.pan.x = drag.ox + (ev.clientX - drag.sx);
      state.pan.y = drag.oy + (ev.clientY - drag.sy);
      applyTransform();
    } else if (drag.type === 'link') {
      state.temp = { from: drag.from, point: toWorld(ev) };
      renderEdges();
    }
  });

  document.addEventListener('pointerup', function (ev) {
    if (!drag) return;
    if (drag.type === 'link') {
      var target = document.elementFromPoint(ev.clientX, ev.clientY);
      var portEl = target && target.closest ? target.closest('.port') : null;
      if (portEl && portEl.dataset.dir === 'in') {
        if (connect(drag.from, { node: portEl.dataset.node, port: portEl.dataset.port })) {
          state.temp = null;
        }
      }
      state.temp = null;
      wrap.classList.remove('linking');
      render();
    } else if (drag.type === 'node') {
      render();
    }
    wrap.classList.remove('panning');
    drag = null;
  });

  wrap.addEventListener('wheel', function (ev) {
    ev.preventDefault();
    var r = wrap.getBoundingClientRect();
    var mx = ev.clientX - r.left, my = ev.clientY - r.top;
    var old = state.pan.k;
    var factor = Math.exp(-ev.deltaY * 0.0012);
    var k = Math.min(2.4, Math.max(0.3, old * factor));
    if (k === old) return;
    state.pan.x = mx - ((mx - state.pan.x) / old) * k;
    state.pan.y = my - ((my - state.pan.y) / old) * k;
    state.pan.k = k;
    applyTransform();
  }, { passive: false });

  nodesEl.addEventListener('click', function (ev) {
    var btn = ev.target.closest ? ev.target.closest('[data-confirm]') : null;
    if (btn) { confirmHuman(btn.dataset.confirm); return; }
    var portEl = ev.target.closest ? ev.target.closest('.port') : null;
    if (portEl) return;
    var nodeEl = ev.target.closest ? ev.target.closest('.node') : null;
    if (nodeEl) { state.sel = { kind: 'node', id: nodeEl.dataset.id }; render(); }
  });

  edgesEl.addEventListener('click', function (ev) {
    var hit = ev.target.closest ? ev.target.closest('[data-edge]') : null;
    if (!hit) return;
    state.sel = { kind: 'edge', id: hit.dataset.edge };
    render();
  });


  document.addEventListener('keydown', function (ev) {
    var tag = (ev.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if ((ev.key === 'Delete' || ev.key === 'Backspace') && state.sel) {
      ev.preventDefault();
      if (state.sel.kind === 'node') removeNode(state.sel.id);
      else if (state.sel.kind === 'edge') {
        state.edges = state.edges.filter(function (e) { return e.id !== state.sel.id; });
        state.sel = null; render();
      }
    }
    if (ev.key === 'Escape') { state.sel = null; render(); }
  });

  /* ---------------- 校验 / 运行 ---------------- */
  function topoOrder() {
    var indeg = {}, adj = {};
    state.nodes.forEach(function (n) { indeg[n.id] = 0; adj[n.id] = []; });
    state.edges.forEach(function (e) {
      if (indeg[e.to.node] == null || indeg[e.from.node] == null) return;
      adj[e.from.node].push(e.to.node);
      indeg[e.to.node] += 1;
    });
    var q = state.nodes.filter(function (n) { return indeg[n.id] === 0; }).map(function (n) { return n.id; });
    var order = [];
    while (q.length) {
      var id = q.shift();
      order.push(id);
      (adj[id] || []).forEach(function (next) {
        indeg[next] -= 1;
        if (indeg[next] === 0) q.push(next);
      });
    }
    return order.length === state.nodes.length ? order : null;
  }

  function incomingCount(nodeId, portId) {
    return state.edges.filter(function (e) {
      return e.to.node === nodeId && e.to.port === portId;
    }).length;
  }

  function validateGraph() {
    var problems = [];
    if (!state.nodes.length) problems.push('画布是空的');
    var order = topoOrder();
    if (!order && state.nodes.length) problems.push('存在环，无法确定执行顺序');
    state.nodes.forEach(function (n) {
      var def = defOf(n);
      def.inputs.forEach(function (p) {
        if (incomingCount(n.id, p.id) === 0) {
          problems.push(def.title + ' 的「' + p.label + '」没有输入');
        }
      });
      if (def.outputs.length && !state.edges.some(function (e) { return e.from.node === n.id; })) {
        problems.push(def.title + ' 的输出没有下游');
      }
    });
    return { order: order, problems: problems };
  }

  function sleep(ms) {
    return new Promise(function (res) { setTimeout(res, ms); });
  }

  function setStatus(node, status) {
    node.status = status;
    render();
  }

  function confirmHuman(nodeId) {
    if (state.pendingHuman && state.pendingHuman.id === nodeId) {
      var done = state.pendingHuman.resolve;
      state.pendingHuman = null;
      done();
    }
  }

  function waitHuman(node) {
    return new Promise(function (resolve) {
      state.pendingHuman = { id: node.id, resolve: resolve };
      setStatus(node, 'waiting');
    });
  }

  async function runFlow() {
    if (state.running) return;
    var v = validateGraph();
    if (!v.order) { toast(v.problems[0] || '图不合法', 'err'); return; }

    state.running = true;
    state.abort = false;
    document.getElementById('btnRun').disabled = true;
    document.getElementById('btnStop').disabled = false;
    state.nodes.forEach(function (n) { n.status = 'idle'; });
    render();
    toast('开始执行 ' + v.order.length + ' 个节点', 'ok');

    for (var i = 0; i < v.order.length; i++) {
      if (state.abort) break;
      var n = nodeById(v.order[i]);
      if (!n) continue;
      var def = defOf(n);
      var missing = def.inputs.filter(function (p) { return incomingCount(n.id, p.id) === 0; });
      if (missing.length) { setStatus(n, 'blocked'); continue; }

      setStatus(n, 'running');
      var failed = await sleep(def.cat === 'human' ? 320 : 480 + Math.random() * 380).then(function () {
        return n.defId === 'check.rules' && n.config.strict && Math.random() < 0.12;
      });
      if (state.abort) { setStatus(n, 'idle'); break; }

      if (failed) {
        setStatus(n, 'failed');
        toast(def.title + ' 校验未通过，流程中断', 'err');
        break;
      }
      if (def.cat === 'human') {
        await waitHuman(n);
        if (state.abort) { setStatus(n, 'idle'); break; }
      }
      setStatus(n, 'done');
    }

    state.running = false;
    state.pendingHuman = null;
    document.getElementById('btnRun').disabled = false;
    document.getElementById('btnStop').disabled = true;
    render();
    var allDone = state.nodes.every(function (n) { return n.status === 'done' || n.status === 'blocked'; });
    if (state.abort) toast('已停止');
    else if (allDone) toast('流程跑完', 'ok');
  }

  /* ---------------- 示例图 / 存取 ---------------- */
  function sampleGraph() {
    state.nodes = [];
    state.edges = [];
    state.seq = 0;
    state.sel = null;

    var doc = addNode('input.doc', 60, 120);
    var ret = addNode('retrieve.knowledge', 60, 300);
    var gen = addNode('dsh.generate', 330, 170);
    var hum = addNode('human.edit-confirm', 600, 170);
    var chk = addNode('check.rules', 860, 170);
    var ext = addNode('transform.extract', 860, 350);
    var pub = addNode('publish.domain', 1120, 230);

    doc.config.source = '产品笔记';
    ret.config.topK = 6;

    connect({ node: doc.id, port: 'out' }, { node: gen.id, port: 'in' });
    connect({ node: ret.id, port: 'hits' }, { node: gen.id, port: 'in' });
    connect({ node: gen.id, port: 'out' }, { node: hum.id, port: 'in' });
    connect({ node: hum.id, port: 'out' }, { node: chk.id, port: 'in' });
    connect({ node: chk.id, port: 'pass' }, { node: ext.id, port: 'in' });
    connect({ node: ext.id, port: 'out' }, { node: pub.id, port: 'in' });

    state.sel = null;
    render();
    setTimeout(fitView, 30);
  }

  function exportJSON() {
    var data = {
      version: 1,
      name: document.getElementById('flowName').value,
      nodes: state.nodes.map(function (n) {
        return { id: n.id, type: n.defId, x: n.x, y: n.y, config: n.config };
      }),
      edges: state.edges.map(function (e) {
        return { from: e.from, to: e.to };
      })
    };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (data.name || 'workflow') + '.json';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast('已导出 JSON', 'ok');
  }

  function importJSON(text) {
    var data = JSON.parse(text);
    if (!data || !Array.isArray(data.nodes)) throw new Error('不是工作流文件');
    state.nodes = [];
    state.edges = [];
    state.seq = 0;
    state.sel = null;
    var map = {};
    data.nodes.forEach(function (n) {
      if (!DEFS[n.type]) return;
      var def = DEFS[n.type];
      var cfg = {};
      (def.config || []).forEach(function (c) { cfg[c.key] = c.value; });
      Object.assign(cfg, n.config || {});
      var node = { id: n.id, defId: n.type, x: n.x, y: n.y, config: cfg, status: 'idle' };
      state.nodes.push(node);
      map[n.id] = node;
      var num = /-(\d+)$/.exec(n.id);
      if (num) state.seq = Math.max(state.seq, Number(num[1]));
    });
    (data.edges || []).forEach(function (e) {
      if (!map[e.from.node] || !map[e.to.node]) return;
      state.edges.push({ id: uid('e'), from: e.from, to: e.to });
    });
    if (data.name) document.getElementById('flowName').value = data.name;
    render();
    setTimeout(fitView, 30);
    toast('已导入 ' + state.nodes.length + ' 个节点', 'ok');
  }

  /* ---------------- 绑定 ---------------- */
  document.getElementById('btnSample').addEventListener('click', function () {
    if (state.running) { toast('运行中不能换图', 'err'); return; }
    sampleGraph();
    toast('已载入示例图', 'ok');
  });
  document.getElementById('btnFit').addEventListener('click', fitView);
  document.getElementById('btnValidate').addEventListener('click', function () {
    var v = validateGraph();
    if (!v.problems.length) { toast('图合法，可以运行', 'ok'); return; }
    toast(v.problems.slice(0, 3).join('；'), 'err');
  });
  document.getElementById('btnRun').addEventListener('click', runFlow);
  document.getElementById('btnStop').addEventListener('click', function () {
    state.abort = true;
    if (state.pendingHuman) { var r = state.pendingHuman.resolve; state.pendingHuman = null; r(); }
    toast('正在停止…');
  });
  document.getElementById('btnSave').addEventListener('click', exportJSON);
  document.getElementById('btnLoad').addEventListener('click', function () {
    document.getElementById('fileInput').click();
  });
  document.getElementById('fileInput').addEventListener('change', function (ev) {
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      try { importJSON(String(reader.result)); }
      catch (err) { toast('导入失败：' + err.message, 'err'); }
    };
    reader.readAsText(f);
    ev.target.value = '';
  });

  /* ---------------- 启动 ---------------- */
  renderPalette();
  sampleGraph();
  applyTransform();
})();
</script>
</body>
</html>
